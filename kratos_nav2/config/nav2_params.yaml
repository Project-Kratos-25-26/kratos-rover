# =====================================================
# BT Navigator
# =====================================================
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20

# =====================================================
# Planner Server
# =====================================================
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      downsampling_factor: 1
      use_astar: false
      allow_unknown: true
      motion_model_for_search: "DIFF_DRIVE"
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

# =====================================================
# Controller Server
# =====================================================
# =====================================================
# Controller Server
# =====================================================
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0  # <--- LOWERED from 20.0 to prevent lag
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    # --- Progress Checker (Prevents "Goal Failed" timeouts) ---
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 30.0    # <--- Increased to 30s (gives robot time to think)

    # --- Goal Checker ---
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True

    # --- Pure Pursuit Controller (Steering Logic) ---
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.35         # Slightly slower for better control
      lookahead_dist: 1.5              # INCREASED: Smoother path following
      min_lookahead_dist: 0.5
      max_lookahead_dist: 2.0
      lookahead_time: 2.0
      rotate_to_heading_angular_vel: 0.5 # REDUCED: Slower, controlled turns
      transform_tolerance: 0.5         # INCREASED: Fixes the "Extrapolation" warnings
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      use_approach_linear_velocity_scaling: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      allow_reversing: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785

# =====================================================
# Local Costmap (ODOM frame)
# =====================================================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true

      # ⚠️ MUST be integers
      width: 6
      height: 6

      resolution: 0.05
      robot_radius: 0.3

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55  
        cost_scaling_factor: 3.0

# =====================================================
# Global Costmap (MAP frame from RTAB-Map)
# =====================================================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      robot_radius: 0.3
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map   # change to /rtabmap/grid_map if needed

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: scan
          data_type: LaserScan
          clearing: true
          marking: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.8
        cost_scaling_factor: 3.0

# =====================================================
# Behavior / Recovery Server
# =====================================================
behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint

# =====================================================
# Velocity Smoother (optional but recommended)
# =====================================================
velocity_smoother:
  ros__parameters:
    use_sim_time: true

